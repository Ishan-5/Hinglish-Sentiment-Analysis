<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinglish Sentiment Analyzer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            color: #38bdf8;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #7dd3fc;
        }
        .result-card {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #0f172a;
            border-radius: 6px;
            border-left: 5px solid #64748b;
            display: none;
        }
        .result-card.Positive { border-left-color: #22c55e; }
        .result-card.Negative { border-left-color: #ef4444; }
        .result-card.Neutral { border-left-color: #eab308; }
        
        .sentiment-label {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .scores {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hinglish Sentiment Analyzer</h1>
    <textarea id="commentInput" placeholder="Type your Hinglish comment here... (e.g., bhai maza aa gaya!)"></textarea>
    <button onclick="analyzeSentiment()">Analyze Sentiment</button>

    <div id="resultCard" class="result-card">
        <div id="sentimentResult" class="sentiment-label">Prediction</div>
        <div id="scoresResult" class="scores">Scores</div>
    </div>
</div>

<script>
    async function analyzeSentiment() {
        const commentText = document.getElementById('commentInput').value.trim();
        const resultCard = document.getElementById('resultCard');
        const sentimentResult = document.getElementById('sentimentResult');
        const scoresResult = document.getElementById('scoresResult');

        if (!commentText) {
            alert('Please enter a comment first.');
            return;
        }

        try {
            // Relative path request to your unified FastAPI server
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ comment: commentText })
            });

            if (!response.ok) {
                throw new Error('Server response error');
            }

            const data = await response.json();

            // Render output visually
            resultCard.className = `result-card ${data.sentiment}`;
            resultCard.style.display = 'block';
            
            sentimentResult.innerText = `Sentiment: ${data.sentiment}`;
            scoresResult.innerHTML = `
                Negative: ${(data.confidence_scores.Negative * 100).toFixed(2)}%<br>
                Positive: ${(data.confidence_scores.Positive * 100).toFixed(2)}%<br>
                Neutral: ${(data.confidence_scores.Neutral * 100).toFixed(2)}%
            `;

        } catch (error) {
            alert('Could not connect to the API endpoint. Verify your Uvicorn server is up.');
            console.error(error);
        }
    }
</script>

</body>
</html>
